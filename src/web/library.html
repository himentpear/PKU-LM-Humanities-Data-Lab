<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>考古文献 · 数字阅览室</title>
<style>
:root{font:15px/1.65 "Microsoft YaHei",system-ui,sans-serif;color:#273c39;background:#f4f3ee;--green:#275d51;--line:#d9dfd7}*{box-sizing:border-box}body{margin:0}header{padding:17px 28px;background:#203e36;color:#fff;display:flex;justify-content:space-between;align-items:center}h1{font-family:serif;font-size:23px;letter-spacing:2px;margin:0}header span{font-size:12px;color:#c6d6ce}.toolbar{display:flex;gap:10px;padding:14px 24px;align-items:center;border-bottom:1px solid var(--line);background:#fff;flex-wrap:wrap}select,input,textarea,button{font:inherit;border:1px solid #bdc9be;border-radius:5px;padding:7px 10px;background:#fff;color:inherit}select{max-width:410px}button{cursor:pointer}button:hover{background:#e8eee6}button.primary{background:var(--green);color:white;border-color:var(--green)}button:disabled{opacity:.5;cursor:default}a{color:var(--green)}main{display:grid;grid-template-columns:205px minmax(400px,1fr) 350px;height:calc(100vh - 145px);min-height:500px}.side,.textpanel{overflow:auto;background:#fff;padding:16px}.side{border-right:1px solid var(--line)}.textpanel{border-left:1px solid var(--line)}h2{font-size:13px;letter-spacing:1px;color:#6b7a6b;margin:0 0 12px}.pagebtn{display:block;width:100%;text-align:left;margin:4px 0;font-size:13px}.active{background:#e0ece5!important;border-color:#568570}.viewer{overflow:auto;padding:22px;background:#e7e9e1}.sheet{position:relative;max-width:1050px;margin:auto;box-shadow:0 5px 25px #243e3320}.sheet img{display:block;width:100%}.sheet svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.sheet rect{fill:#d8b04344;stroke:#b17e20;stroke-width:2}.line{font-size:14px;padding:7px;border-bottom:1px solid #edf0e9;cursor:pointer;white-space:pre-wrap}.line:hover,.line.selected{background:#f6edce}.muted{color:#7e887b;font-size:12px}.empty{padding:40px;text-align:center;color:#7c887a}details{border:1px solid var(--line);border-radius:5px;margin:15px 0;padding:10px}summary{cursor:pointer;color:var(--green)}label{display:block;font-size:12px;margin:8px 0 3px}textarea{width:100%;min-height:70px}#status{font-size:12px;margin-left:auto}#results button{display:block;width:100%;text-align:left;font-size:12px;margin:5px 0}#notice{padding:6px 24px;font-size:12px;background:#ecf0e8;min-height:30px}@media(max-width:1050px){main{grid-template-columns:150px 1fr 290px}.toolbar{padding:10px}.viewer{padding:8px}}@media(max-width:760px){main{display:block;height:auto}.side{max-height:160px}.viewer{height:70vh}.textpanel{height:60vh}header{padding:15px}header span{display:none}}
</style>
<header><h1>考古文献 · 数字阅览室</h1><span>原页 · 文字 · 证据</span></header>
<div class="toolbar"><select id="documents" aria-label="选择文献"><option>正在载入文献…</option></select><button id="previous">上一页</button><input id="pageNumber" type="number" min="1" value="1" style="width:75px" aria-label="物理页序"><button id="next">下一页</button><input id="query" placeholder="搜索原文或器物编号" aria-label="检索词"><button id="search" class="primary">检索</button><span id="status"></span></div>
<div id="notice">选择一份文献开始阅览。页码不确定的页面保留审校提示。</div>
<main><aside class="side"><h2>页面</h2><div id="pageList"></div><h2 style="margin-top:20px">检索结果</h2><div id="results"></div></aside><section class="viewer"><div class="sheet"><img id="scan" alt="文献原始页面"><svg id="overlay"></svg></div></section><aside class="textpanel"><h2 id="pageTitle">原文</h2><div id="exports"></div><details><summary>审校当前页面</summary><p class="muted">先选择文字行，再填写校对结果。原始识别文字会保留。</p><label>审校任务</label><select id="task" style="width:100%"></select><label>校对文字</label><textarea id="correction"></textarea><label>审校人</label><input id="actor" placeholder="姓名" style="width:100%"><label>依据与说明</label><textarea id="note" placeholder="对照原页说明修改依据"></textarea><button id="approve" class="primary">确认通过</button> <button id="reject">标记不通过</button><p id="reviewStatus" class="muted"></p></details><div id="lines" class="empty">尚未选择页面</div></aside></main>
<script>
const $=id=>document.getElementById(id);let docs=[],pages=[],current=0,bundle=null,selected=null;
const request=async(url,options)=>{let r=await fetch(url,options);let d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d};
function element(tag,text,parent){let el=document.createElement(tag);el.textContent=text;parent.append(el);return el}
function notice(text){$('notice').textContent=text}
function highlight(xywh){$('overlay').replaceChildren();if(!xywh)return;let [x,y,w,h]=xywh.split(',');let rect=document.createElementNS('http://www.w3.org/2000/svg','rect');for(let [k,v] of Object.entries({x,y,width:w,height:h}))rect.setAttribute(k,v);$('overlay').append(rect)}
async function loadDocs(){docs=await request('/api/documents');$('documents').replaceChildren();for(let d of docs){let o=element('option',d.title+' · '+d.pages+' 页',$('documents'));o.value=d.id}if(docs.length)await loadDocument();else notice('尚无处理完成的文献。处理任务完成后刷新此页。')}
async function loadDocument(){pages=await request('/api/pages?manifest='+encodeURIComponent($('documents').value));$('pageList').replaceChildren();$('results').replaceChildren();for(let [i,p]of pages.entries()){let b=element('button',p.scan_index+' · '+(p.label||'未识别页码'),$('pageList'));b.className='pagebtn';b.onclick=()=>showPage(i)}current=0;await showPage(0)}
async function showPage(index,xywh){if(index<0||index>=pages.length)return;current=index;selected=null;let p=pages[index];bundle=await request('/api/page?id='+p.id);$('scan').src=bundle.scan_image.full_image_url;$('overlay').setAttribute('viewBox','0 0 '+bundle.geometry.canvas.join(' '));highlight(xywh);$('pageNumber').value=p.scan_index;$('status').textContent=(index+1)+' / '+pages.length;$('pageTitle').textContent='原文 · '+(p.label||'未识别页码');$('previous').disabled=index===0;$('next').disabled=index===pages.length-1;for(let [i,b] of [...$('pageList').children].entries())b.classList.toggle('active',i===index);$('lines').replaceChildren();$('lines').className='';for(let line of bundle.lines){let el=element('div',line.text,$('lines'));el.className='line';el.onclick=()=>{selected=line;$('correction').value=line.text;for(let x of $('lines').children)x.classList.remove('selected');el.classList.add('selected');highlight(line.xywh)}}if(!bundle.lines.length)element('p','本页未提取到文字，请对照原页。',$('lines'));$('task').replaceChildren();for(let t of bundle.review_tasks){let o=element('option',t.risk_type+' · '+t.status,$('task'));o.value=t.task_id}if(!bundle.review_tasks.length)element('option','本页没有待审校任务',$('task'));$('exports').replaceChildren();for(let [name,file]of [['Manifest','manifest.json'],['质量报告','quality.json'],['本页 ALTO','alto/'+String(p.scan_index).padStart(5,'0')+'.xml']]){let a=element('a',name+'  ',$('exports'));a.href='/api/export/'+$('documents').value+'/'+file;a.target='_blank'}$('reviewStatus').textContent='';notice('物理页 '+p.scan_index+' · 印刷页码 '+(p.label||'待确认')+' · '+p.domain+' · '+bundle.review_tasks.length+' 项审校记录')}
async function search(){let q=$('query').value.trim();if(!q)return;let data=await request('/api/search?manifest='+$('documents').value+'&q='+encodeURIComponent(q));$('results').replaceChildren();for(let hit of data.items){let b=element('button',(hit.printed_page||'?')+' · '+hit.body.value.slice(0,80),$('results'));b.onclick=()=>{let id=hit.target.split('/canvas/')[1].split('#')[0];let index=pages.findIndex(p=>p.id===id);showPage(index,hit.target.split('xywh=')[1])}}notice('检索“'+q+'”命中 '+data.total+' 行')}
async function review(status){if(!bundle||!$('task').value)return;try{let data={task_id:$('task').value,actor:$('actor').value,note:$('note').value,status,expected_revision:bundle.revision};if(selected&&status==='approved'&&$('correction').value!==selected.text){data.line_id=selected.id;data.text=$('correction').value}await request('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});await showPage(current);$('reviewStatus').textContent='已保存审校记录'}catch(e){$('reviewStatus').textContent=e.message}}
$('documents').onchange=()=>loadDocument().catch(e=>notice(e.message));$('previous').onclick=()=>showPage(current-1);$('next').onclick=()=>showPage(current+1);$('pageNumber').onchange=()=>showPage(Number($('pageNumber').value)-1);$('search').onclick=()=>search().catch(e=>notice(e.message));$('query').onkeydown=e=>{if(e.key==='Enter')search().catch(e=>notice(e.message))};$('approve').onclick=()=>review('approved');$('reject').onclick=()=>review('rejected');loadDocs().catch(e=>notice(e.message));
</script></html>
